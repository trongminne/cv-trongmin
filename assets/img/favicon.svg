<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2347" />
      <stop offset="60%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>

    <!-- Border Cyan-Blue Neon Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Core Drop Shadow -->
    <filter id="coreShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f5ff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="26" fill="url(#bgGrad)" />

  <!-- Neon Glowing Outer Border -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="none" stroke="url(#neonBorder)" stroke-width="4.5" />

  <!-- Inner Tech Accent Grid/Lines -->
  <path d="M4 36 L16 36 M112 36 L124 36 M4 92 L16 92 M112 92 L124 92" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.5" />

  <!-- Stylized Hexagon Core Outline -->
  <polygon points="64,18 104,38 104,90 64,110 24,90 24,38" fill="rgba(14,42,82,0.45)" stroke="url(#neonBorder)" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Top-Right Tech Status Node -->
  <circle cx="98" cy="30" r="5" fill="#00f5ff" filter="url(#neonGlow)" />

  <!-- Main Monogram "TM" - Sharp, Futuristic, High Legibility at Small Sizes -->
  <g filter="url(#coreShadow)">
    <!-- Letter T -->
    <path d="M 28 44 L 62 44 L 62 52 L 49 52 L 49 84 L 41 84 L 41 52 L 28 52 Z" fill="url(#glyphGrad)" />
    <!-- Letter M -->
    <path d="M 64 44 L 72 44 L 82 66 L 92 44 L 100 44 L 100 84 L 92 84 L 92 57 L 84 76 L 80 76 L 72 57 L 72 84 L 64 84 Z" fill="url(#glyphGrad)" />
  </g>

  <!-- Bottom Terminal Accent: </> Code Brackets -->
  <path d="M 52 96 L 47 99 L 52 102 M 76 96 L 81 99 L 76 102 M 62 103 L 66 95" fill="none" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
